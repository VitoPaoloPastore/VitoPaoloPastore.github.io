# Basic site settings
locale                   : "en-US"
title                    : "Machine Learning Researcher at the University of Genoa"
title_separator          : "-"
name                     : &name "Vito Paolo Pastore"
description              : &description "Vito Paolo Pastore is a tenure-track assistant professor and researcher in machine learning, computer vision, algorithmic fairness, and biomedical image analysis at the University of Genoa."
url                      : "https://vitopaolopastore.github.io"
baseurl                  : ""
repository               : "VitoPaoloPastore/VitoPaoloPastore.github.io"

# Site author
author:
  avatar           : "bio-photo.png"
  name             : "Vito Paolo Pastore"
  pronouns         :
  bio              : "Tenure-track Assistant Professor and Machine Learning Researcher"
  location         : "Genoa, Italy"
  employer         : "MaLGa–DIBRIS, University of Genoa"
  uri              : "https://vitopaolopastore.github.io/"
  email            : "vito.paolo.pastore@unige.it"

  # Academic profiles
  arxiv            :
  googlescholar    : "https://scholar.google.com/citations?user=-boYCXcAAAAJ"
  impactstory      :
  orcid            : "https://orcid.org/0000-0002-5827-5571"
  pubmed           :
  scopus           : "https://www.scopus.com/authid/detail.uri?authorId=57208643040"
  researchgate     :

  # Repositories and software development
  bitbucket        :
  codepen          :
  dribbble         :
  github           : "VitoPaoloPastore"
  kaggle           :
  stackoverflow    :

  # Social media
  bluesky          :
  facebook         :
  flickr           :
  foursquare       :
  goodreads        :
  google_plus      :
  keybase          :
  instagram        :
  lastfm           :
  linkedin         :
  mastodon         :
  medium           :
  pinterest        :
  soundcloud       :
  steam            :
  telegram         :
  tumblr           :
  twitter          :
  vine             :
  weibo            :
  wikipedia        :
  xing             :
  youtube          :
  zhihu            :

# Site settings
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

comments:
  provider               :
  disqus:
    shortname            :
  discourse:
    server               :
  facebook:
    appid                :
    num_posts            :
    colorscheme          :

staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601"

atom_feed:
  hide                   : false
  path                   :

# Search-engine verification
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Social sharing
twitter:
  username               : &twitter
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 :

# Identity links used by the theme's SEO metadata
social:
  type                   : Person
  name                   : "Vito Paolo Pastore"
  links:
    - "https://orcid.org/0000-0002-5827-5571"
    - "https://scholar.google.com/citations?user=-boYCXcAAAAJ"
    - "https://dibris.unige.it/vito.paolo.pastore@unige.it"
    - "https://unige.iris.cineca.it/cris/rp/rp08693?type=all"
    - "https://www.scopus.com/authid/detail.uri?authorId=57208643040"
    - "https://ieeexplore.ieee.org/author/37085497249"
    - "https://openreview.net/profile?id=~Vito_Paolo_Pastore1"
    - "https://loop.frontiersin.org/people/282459/overview"
    - "https://github.com/VitoPaoloPastore"

# Analytics: enable Google Analytics 4 only when a measurement ID is available
analytics:
  provider               : false
  google:
    tracking_id          :

# Reading files
include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  patents:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/
  news:
    output: true
    permalink: /:collection/:path/
  research:
    output: true
    permalink: /:collection/:path/

# Default layouts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: patents
    values:
      layout: single
      author_profile: true
      share: true
      comment: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true
  - scope:
      path: ""
      type: news
    values:
      layout: news
      author_profile: true
      share: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Output
permalink: /:categories/:title/
timezone: Europe/Rome

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from

whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

# HTML compression
compress_html:
  clippings: all
  ignore:
    envs: development
